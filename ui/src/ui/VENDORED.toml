# Rust/UI (Leptos) sources vendored by hand (spec §9.1): `ui add` is broken upstream.
# Files are byte-identical to upstream unless listed under [ported]; `sha256` is the
# hash of the UPSTREAM file at `commit`, so `shasum -a 256` shows any local drift.
# mod.rs files (here and in ../hooks) are ours: they list only the vendored modules.

[source]
repo = "https://github.com/rust-ui/leptos-ui"
commit = "9cb8e9f251a254bea19c5d00318e296bb13dca05"   # main, 2026-09-22
fetched = "2026-09-28"
ui_dir = "app_crates/registry/src/ui"                 # -> ui/src/ui/
hooks_dir = "app_crates/registry/src/hooks"           # -> ui/src/hooks/

[ported]
"dialog.rs" = "ATM-PORT: inline script element removed; `open: RwSignal<bool>` on <Dialog> drives data-state; Esc (window keydown) and backdrop click close; use_scroll_lock::lock/unlock from Rust; focus first focusable, restored on close; pointer-events via data-state classes instead of inline style"
"button.rs" = "ATM-PORT: `support_aria_current: true` removed from variants! (it expands to leptos_router::use_location; no router in this app, D12)"

