[workspace]
resolver = "3"
members = ["crates/atm-types", "crates/atm-core", "src-tauri", "ui"]
default-members = ["crates/atm-types", "crates/atm-core", "src-tauri"]   # ui: solo wasm32 via Trunk

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"

# Frozen after M1 (spec §11.1): every dependency of every later package is declared here.
# A package that needs something new reports it; only the orchestrator edits this file.
[workspace.dependencies]
atm-types = { path = "crates/atm-types" }
atm-core = { path = "crates/atm-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync",
  "time", "fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
libc = "0.2.189"
sha2 = "0.11.0"
tauri = { version = "=2.12.0", features = [] }
tauri-build = "=2.7.0"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-single-instance = "=2.5.0"
leptos = { version = "=0.8.21", features = ["csr"] }
leptos_ui = "=0.3.22"
tw_merge = { version = "=0.1.22", features = ["variant"] }
icons = { version = "=0.19.0", features = ["leptos"] }
strum = { version = "0.27", features = ["derive"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
  # DOM basics, theme (matchMedia), selftest (CSP events, synthetic keys)
  "Window", "Document", "Location", "Node", "NodeList", "HtmlCollection", "Element", "HtmlElement",
  "EventTarget", "AddEventListenerOptions", "CssStyleDeclaration", "DomTokenList", "DomRect",
  "MediaQueryList", "MediaQueryListEvent", "SecurityPolicyViolationEvent",
  "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "FocusEvent",
  # forms
  "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement",
  # kanban drag-and-drop (spec §9.3)
  "DragEvent", "DataTransfer",
  # transcript window: scroll anchoring, autoscroll, "load previous" (spec §9.4)
  "ScrollToOptions", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition",
  "ResizeObserver", "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverEntry",
  "IntersectionObserverInit",
  # copyable `claude auth login` fallback (spec §7.10), mock persistence
  "Navigator", "Clipboard", "Storage",
] }
console_error_panic_hook = "0.1.7"
insta = { version = "1.48.0", features = ["json"] }
tempfile = "3.27.0"

[profile.release]            # alla radice: cargo ignora i profili dei membri
codegen-units = 1
lto = true
opt-level = 3
strip = true
# panic = "unwind" (default): un task in panic non abbatte l'app lasciando agenti orfani
[profile.release.package.atm-ui]
opt-level = "z"
