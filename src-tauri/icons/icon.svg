<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- AI Task Manager app icon, source of src-tauri/icons/* (scripts/render-icon.swift, then
       `cargo tauri icon`). Body on the macOS icon grid: 824 px, radius 185. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- three columns -->
  <g fill="#FFFFFF" fill-opacity="0.16">
    <rect x="190" y="236" width="192" height="552" rx="44"/>
    <rect x="416" y="236" width="192" height="552" rx="44"/>
    <rect x="642" y="236" width="192" height="552" rx="44"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.6">
    <rect x="218" y="270" width="84" height="22" rx="11"/>
    <rect x="444" y="270" width="84" height="22" rx="11"/>
    <rect x="670" y="270" width="84" height="22" rx="11"/>
  </g>
  <!-- card shadows -->
  <g fill="#1E1B4B" fill-opacity="0.18">
    <rect x="208" y="330" width="156" height="104" rx="26"/>
    <rect x="208" y="454" width="156" height="104" rx="26"/>
    <rect x="208" y="578" width="156" height="104" rx="26"/>
    <rect x="434" y="330" width="156" height="104" rx="26"/>
    <rect x="434" y="454" width="156" height="104" rx="26"/>
    <rect x="660" y="330" width="156" height="104" rx="26"/>
  </g>
  <!-- cards -->
  <g fill="#FFFFFF">
    <rect x="208" y="322" width="156" height="104" rx="26"/>
    <rect x="208" y="446" width="156" height="104" rx="26"/>
    <rect x="208" y="570" width="156" height="104" rx="26"/>
    <rect x="434" y="322" width="156" height="104" rx="26"/>
    <rect x="434" y="446" width="156" height="104" rx="26"/>
    <rect x="660" y="322" width="156" height="104" rx="26"/>
  </g>
  <!-- card text lines -->
  <g fill="#C7D2FE">
    <rect x="234" y="352" width="104" height="16" rx="8"/>
    <rect x="234" y="476" width="104" height="16" rx="8"/>
    <rect x="234" y="600" width="104" height="16" rx="8"/>
    <rect x="460" y="476" width="104" height="16" rx="8"/>
  </g>
  <g fill="#E0E7FF">
    <rect x="234" y="382" width="68" height="16" rx="8"/>
    <rect x="234" y="506" width="68" height="16" rx="8"/>
    <rect x="234" y="630" width="68" height="16" rx="8"/>
    <rect x="460" y="506" width="68" height="16" rx="8"/>
  </g>
  <!-- the agent at work: a sparkle on the running card -->
  <path d="M512 336 C518 362 528 372 554 378 C528 384 518 394 512 420 C506 394 496 384 470 378 C496 372 506 362 512 336 Z"
        fill="url(#spark)"/>
  <!-- done: a check -->
  <circle cx="738" cy="374" r="34" fill="#22C55E"/>
  <path d="M722 375 L734 387 L756 362" fill="none" stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
